<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<title>Calculadora de Juros Simples com IRS</title>

<style>
    body {
        font-family: 'Segoe UI', Arial, sans-serif;
        background: #eef1f7;
        padding: 40px;
        margin: 0;
        color: #333;
    }

    .container {
        max-width: 600px;
        margin: auto;
        background: #ffffff;
        padding: 35px;
        border-radius: 12px;
        box-shadow: 0 4px 14px rgba(0,0,0,0.08);
    }

    /* ---------- TÍTULO EM DUAS LINHAS ---------- */
    .titulo-principal {
        text-align: center;
        color: #1a2a6c;
        font-size: 1.8rem;
        font-weight: 700;
        margin-bottom: 10px;
        line-height: 1.2;
    }

    .titulo-principal .subtitulo {
        font-size: 1.2rem;
        font-weight: 500;
        color: #3a4a7a;
    }

    label {
        display: block;
        margin-top: 18px;
        font-weight: 600;
        color: #1a2a6c;
    }

    input {
        width: 100%;
        padding: 12px;
        margin-top: 6px;
        border: 1px solid #cfd6e4;
        border-radius: 6px;
        font-size: 15px;
        box-sizing: border-box;
    }

    button {
        margin-top: 25px;
        padding: 14px;
        width: 100%;
        background: linear-gradient(135deg, #1a2a6c, #1a73e8);
        color: white;
        border: none;
        border-radius: 8px;
        font-size: 17px;
        font-weight: 600;
        cursor: pointer;
        transition: 0.2s;
    }

    button:hover {
        opacity: 0.9;
    }

    /* ---------- CARDS RESUMO PREMIUM ---------- */
    .resumo-cards {
        display: flex;
        flex-wrap: wrap;
        gap: 20px;
        margin-top: 30px;
    }

    .card {
        background: #f0f4ff;
        padding: 16px 20px;
        border-radius: 8px;
        min-width: 220px;
        border-left: 4px solid #1a73e8;
        flex: 1;
    }

    .card .titulo {
        font-size: 0.95rem;
        color: #1a2a6c;
        font-weight: 600;
    }

    .card .valor {
        font-size: 1.35rem;
        font-weight: 700;
        margin-top: 6px;
        color: #1a2a6c;
    }
</style>
</head>

<body>

<div class="container">

    <!-- TÍTULO EM DUAS LINHAS -->
    <h2 class="titulo-principal">
        Calculadora de Juros Simples<br>
        <span class="subtitulo">(Ano Comercial)</span>
    </h2>

    <label>Data de Início:</label>
    <input type="date" id="dataInicio">

    <label>Data de Fim:</label>
    <input type="date" id="dataFim">

    <label>Capital (€):</label>
    <input type="number" id="capital" placeholder="Ex: 1000">

    <label>Taxa de Juro (% ao ano):</label>
    <input type="number" id="taxa" placeholder="Ex: 5">

    <label>Taxa de IRS (%):</label>
    <input type="number" id="irs" placeholder="Ex: 28">

    <button onclick="calcular()">Calcular</button>

    <div id="resumoCards" class="resumo-cards"></div>
</div>

<script>
/* ---------- FORMATADOR PT-PT ---------- */
function fmt(v) {
    return v.toLocaleString("pt-PT", {
        minimumFractionDigits: 2,
        maximumFractionDigits: 2
    });
}

function calcular() {
    const inicio = new Date(document.getElementById("dataInicio").value);
    const fim = new Date(document.getElementById("dataFim").value);
    const capital = parseFloat(document.getElementById("capital").value);
    const taxa = parseFloat(document.getElementById("taxa").value) / 100;
    const irs = parseFloat(document.getElementById("irs").value) / 100;

    if (isNaN(inicio) || isNaN(fim) || isNaN(capital) || isNaN(taxa) || isNaN(irs)) {
        alert("Por favor, preencha todos os campos corretamente.");
        return;
    }

    const diffTime = fim - inicio;
    const dias = diffTime / (1000 * 60 * 60 * 24);

    if (dias < 0) {
        alert("A data de fim deve ser posterior à data de início.");
        return;
    }

    /* ---------- CÁLCULO ORIGINAL (mantido) ---------- */
    const jurosBrutos = capital * taxa * (dias / 360);
    const valorIRS = jurosBrutos * irs;
    const jurosLiquidos = jurosBrutos - valorIRS;

    const montanteBruto = capital + jurosBrutos;
    const montanteLiquido = capital + jurosLiquidos;

    /* ---------- RESUMO PREMIUM ---------- */
    document.getElementById("resumoCards").innerHTML = `
        <div class="card">
            <div class="titulo">Dias Decorridos</div>
            <div class="valor">${dias.toFixed(0)}</div>
        </div>

        <div class="card">
            <div class="titulo">Juros Brutos</div>
            <div class="valor">${fmt(jurosBrutos)} €</div>
        </div>

        <div class="card">
            <div class="titulo">IRS (${(irs * 100).toFixed(0)}%)</div>
            <div class="valor">${fmt(valorIRS)} €</div>
        </div>

        <div class="card">
            <div class="titulo">Juros Líquidos</div>
            <div class="valor">${fmt(jurosLiquidos)} €</div>
        </div>

        <div class="card">
            <div class="titulo">Montante Final Bruto</div>
            <div class="valor">${fmt(montanteBruto)} €</div>
        </div>

        <div class="card">
            <div class="titulo">Montante Final Líquido</div>
            <div class="valor">${fmt(montanteLiquido)} €</div>
        </div>
    `;
}
</script>

</body>
</html>
